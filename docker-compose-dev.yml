# Compose para desarrollo local con recarga en caliente (solo servicio API).
# Tests: en el host con `uv sync --dev` y `pytest` (no se instalan en esta imagen).
# Producción: quitar el volumen de código, quitar --reload y usar variables
# de entorno del orquestador en lugar de montar .env si aplica.

services:
  # Redis Stack (RediSearch) para caché semántica vectorial. Sin volumen: estado efímero en dev.
  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  estimator:
    build:
      context: .
      dockerfile: Dockerfile
    image: estimator-svl:dev
    depends_on:
      redis:
        condition: service_healthy

    ports:
      - "8000:8000"

    environment:
      REDIS_URL: redis://redis:6379/0

    # La app valida Settings al importar (app.config): hace falta .env coherente
    # con el proveedor LLM (p. ej. OPENAI_API_KEY). Parte de .env.example.
    env_file:
      - .env

    # Código montado: los cambios en ./app se ven sin rebuild.
    # En Windows/Mac, si --reload no detecta cambios, prueba:
    #   environment:
    #     WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./app:/app/app

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

    restart: unless-stopped

    # Sonda de salud para Docker Compose.
    # Sobrescribe la sonda del Dockerfile
    # (por si se necesita un intervalo menor en dev o un intervalo mayor en prod).
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Microservicio IA — embeddings (S7). Puerto distinto al estimador (app/).
  ai_service:
    build:
      context: .
      dockerfile: Dockerfile
    image: estimator-svl:dev
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - ./ai_service:/app/ai_service
    command: >
      uvicorn ai_service.app.main:app
      --host 0.0.0.0
      --port 8001
      --reload
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
