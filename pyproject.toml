[project]
name = "estimador-cag"
version = "0.1.0"
description = "Servicio FastAPI para estimaciones de software con arquitectura CAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "structlog>=25.1.0",
    "jinja2>=3.1.4",
    "anthropic>=0.97.0",
    "httpx>=0.27.0",
    "fastapi>=0.136.1",
    "litellm>=1.55.0",
    "openai>=2.33.0",
    "redis>=5.0.0",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "streamlit>=1.45.1",
    "uvicorn[standard]>=0.46.0",
    "instructor>=1.7.0",
    "pyyaml>=6.0.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.23.0",
    "pytest>=8.0.0",
]

[tool.uv]
package = false
